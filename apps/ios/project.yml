name: LinkDeck

options:
  bundleIdPrefix: dev.linkdeck
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  LinkDeck:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LinkDeck
        excludes:
          - Resources
          - Info.plist
      - path: LinkDeck/Resources/blocklist.txt
        buildPhase: resources
      - path: LinkDeck/Resources/cosmetic.js
        buildPhase: resources
    info:
      path: LinkDeck/Info.plist
      properties:
        CFBundleDisplayName: LinkDeck
        CFBundleName: LinkDeck
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        CFBundleURLTypes:
          - CFBundleURLName: dev.linkdeck.app
            CFBundleURLSchemes:
              - linkdeck
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UIUserInterfaceStyle: Dark
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.linkdeck.app
        PRODUCT_NAME: LinkDeck
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  LinkDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LinkDeckUITests
    dependencies:
      - target: LinkDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.linkdeck.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LinkDeck
        CODE_SIGNING_ALLOWED: NO

schemes:
  LinkDeck:
    build:
      targets:
        LinkDeck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LinkDeckUITests
    archive:
      config: Release
